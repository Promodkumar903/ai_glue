version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ai_glue
      POSTGRES_PASSWORD: ai_glue_pass
      POSTGRES_DB: ai_glue_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://ai_glue:ai_glue_pass@db:5432/ai_glue_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: your-secret-key
    volumes:
      - .:/app

volumes:
  pg_data: