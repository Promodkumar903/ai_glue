services:
  - type: web
    name: ai-glue-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-glue-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true